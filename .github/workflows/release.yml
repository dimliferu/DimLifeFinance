name: DimLife Android Release

on:
  push:
    branches: [ "main" ]
    paths:
      - "app/build.gradle.kts"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Версия релиза, например v0.6.0"
        required: true
        default: "v0.6.0"

permissions:
  contents: write

concurrency:
  group: dimlife-finance-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Determine release version
        id: version
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$VERSION"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk_name=DimLife-Finance-v${VERSION}.apk" >> "$GITHUB_OUTPUT"

      - name: Prepare signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing repository secret: ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dimlife-release.jks"
          test -s "$RUNNER_TEMP/dimlife-release.jks"
          chmod 600 "$RUNNER_TEMP/dimlife-release.jks"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/dimlife-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          gradle --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/${{ steps.version.outputs.apk_name }}"

      - name: Remove legacy APK asset from this release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = "${{ steps.version.outputs.tag }}";
            let release;
            try {
              const response = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag
              });
              release = response.data;
            } catch (error) {
              if (error.status === 404) {
                core.info("Release does not exist yet; it will be created by the publish step");
                return;
              }
              throw error;
            }
            const legacy = release.assets.find(asset => asset.name === "DimLife.apk");
            if (legacy) {
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: legacy.id
              });
              core.info("Removed legacy DimLife.apk asset");
            } else {
              core.info("No legacy APK asset found");
            }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || steps.version.outputs.tag }}
          target_commitish: main
          name: DimLife Finance ${{ inputs.tag_name || steps.version.outputs.tag }}
          generate_release_notes: true
          files: ${{ runner.temp }}/${{ steps.version.outputs.apk_name }}
